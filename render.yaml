services:
  - type: pserv
    name: medbot-mysql
    runtime: docker
    repo: https://github.com/render-examples/mysql
    plan: starter
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: medbot
      - key: MYSQL_USER
        value: medbot
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: medbot
    runtime: docker
    plan: starter
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromService:
          type: pserv
          name: medbot-mysql
          property: host
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: medbot
      - key: DB_USER
        value: medbot
      - key: DB_PASS
        fromService:
          type: pserv
          name: medbot-mysql
          envVarKey: MYSQL_PASSWORD
